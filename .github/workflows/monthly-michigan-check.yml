name: Monthly Michigan parks check

# Confirms data/Michigan_POTA_Parks.json matches POTA's live park list.
# Downloads fresh park data (only inside this run; nothing is committed) and
# fails if the committed Michigan file differs, listing the parks that are
# added, removed or changed. GitHub emails the workflow's owner when a
# scheduled run fails. Runs late on the 1st so the daily update, which is
# often delayed by hours, has already run that day.
on:
  schedule:
    - cron: '23 18 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download fresh park list
        run: python3 scripts/build_us_ca_parks.py

      - name: Compare Michigan file
        run: |
          set -o pipefail
          status=0
          python3 scripts/build_michigan_parks.py --check | tee result.txt || status=$?
          {
            echo '```'
            cat result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

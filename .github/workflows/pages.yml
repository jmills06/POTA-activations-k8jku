name: Deploy dashboard to GitHub Pages

# Publishes the repo root (index.html + data/) as a static site, so the
# Dakboard screen can point at a URL instead of pasted HTML. Runs on every
# push to main and can be kicked off by hand. The daily data commit is pushed
# with GITHUB_TOKEN, which does not trigger push workflows, so this also runs
# when the Daily JSON Downloader finishes.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily JSON Downloader"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Skip redeploying after a failed daily download; nothing new to publish.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

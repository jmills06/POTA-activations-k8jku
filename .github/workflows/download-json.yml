name: Daily JSON Downloader

on:
  schedule:
    - cron: '0 5 * * *'  # Runs every day at 5 AM UTC
  workflow_dispatch:     # Manual trigger option

permissions:
  contents: write

jobs:
  download-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download JSON
        run: |
          mkdir -p data
          # Download to a temp file and only replace the committed copy once
          # it parses as JSON, so a bucket error page can never overwrite
          # good data that the dashboard is serving.
          # Michigan_POTA_Parks.json is built from the POTA park list below,
          # not from the bucket, whose copy stopped updating in Dec 2025.
          for name in pota_activations; do
            curl -sSL --fail --retry 3 --retry-delay 5 \
              "https://storage.googleapis.com/pota-activations0/${name}.json" \
              -o "/tmp/${name}.json"
            python3 -c "import json,sys; json.load(open('/tmp/${name}.json'))"
            mv "/tmp/${name}.json" "data/${name}.json"
          done

      - name: Build activated parks
        # Looks up coordinates only for parks not already in
        # data/activated_parks.json. Individual lookup failures are logged
        # and retried next run; they never truncate the file. If the script
        # itself errors, still commit the day's activation data below.
        continue-on-error: true
        run: python3 scripts/build_activated_parks.py

      - name: Build US and Canada parks
        # Full US-/CA- park list from pota.app, for reuse in other projects.
        # The script keeps the committed file unless the download passes its
        # checks, and a failure here never blocks the commit below.
        continue-on-error: true
        run: python3 scripts/build_us_ca_parks.py

      - name: Build Michigan parks
        # Active parks in US-MI from data/us_ca_parks.json, in the format the
        # dashboard reads. Keeps the committed file if the result looks short.
        continue-on-error: true
        run: python3 scripts/build_michigan_parks.py

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pota_activations.json data/Michigan_POTA_Parks.json
          for f in data/activated_parks.json data/us_ca_parks.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "Daily JSON update: $(date -u)" || echo "No changes to commit"
          git push
